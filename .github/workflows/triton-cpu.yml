name: Triton CPU

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    name: Triton CPU matrix regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out the pull request merge ref
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install matrix test dependencies
        run: |
          python -m pip install \
            pytest==9.1.1 numpy==2.5.1 onnx==1.22.0 onnxruntime==1.28.0 \
            onnxmltools==1.16.0 scikit-learn==1.9.0 xgboost==3.0.2
      - name: Verify the benchmark matrix
        run: |
          python -m pytest -q tests/test_benchmark.py \
            -k 'build_matrix_covers_every_condition_once_in_reproducible_order or matrix_spec_requires_disjoint_cpus_and_immutable_provenance or non_millisecond_queue_delays_have_unique_run_ids'
